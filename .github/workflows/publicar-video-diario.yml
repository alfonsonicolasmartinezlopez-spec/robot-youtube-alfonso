name: Crear y programar vídeo diario

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  crear-y-programar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt
      - name: Comprobar si toca ejecutar
        id: gate
        env:
          PUBLISH_HOUR: ${{ secrets.PUBLISH_HOUR }}
          TIMEZONE: Europe/Madrid
        run: |
          python - <<'PY'
          import os, datetime as dt
          from zoneinfo import ZoneInfo
          now=dt.datetime.now(ZoneInfo(os.getenv('TIMEZONE','Europe/Madrid')))
          target=os.getenv('PUBLISH_HOUR','19:00')
          h,m=map(int,target.split(':'))
          run=now.hour==h and now.minute<10
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f"run={str(run).lower()}\n")
          print(f"Hora local={now:%H:%M}; ejecutar={run}")
          PY
      - name: Crear y programar
        if: steps.gate.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_LANGUAGE: American English
          CAPTIONS: "false"
          PUBLISH_HOUR: ${{ secrets.PUBLISH_HOUR }}
          TIMEZONE: Europe/Madrid
        run: python scripts/render_and_upload.py
